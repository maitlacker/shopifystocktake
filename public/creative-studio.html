<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Studio – The Self Styler WMS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    .cs-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .cs-layout { grid-template-columns: 1fr; }
    }

    /* Search + product grid */
    .cs-search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .cs-search-bar input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .cs-product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .cs-product-card {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .cs-product-card:hover {
      border-color: #94a3b8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .cs-product-card.selected {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .cs-product-card.selected::after {
      content: '✓';
      position: absolute;
      top: 6px;
      right: 6px;
      background: #6366f1;
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .cs-product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #f8fafc;
    }
    .cs-product-img-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 2rem;
    }
    .cs-product-info {
      padding: 8px 10px 10px;
    }
    .cs-product-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cs-product-price {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 3px;
    }
    .cs-product-vendor {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 1px;
    }

    /* Right panel */
    .cs-panel {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      position: sticky;
      top: 24px;
    }
    .cs-panel h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #1e293b;
      margin: 0 0 16px;
    }

    .cs-selected-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 40px;
    }
    .cs-selected-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #1e293b;
      background: #f8fafc;
      border-radius: 8px;
      padding: 6px 8px;
    }
    .cs-selected-item img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .cs-selected-item-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cs-selected-remove {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .cs-selected-remove:hover { color: #ef4444; }

    .cs-empty-sel {
      font-size: 0.82rem;
      color: #94a3b8;
      text-align: center;
      padding: 12px 0;
    }

    .cs-field {
      margin-bottom: 14px;
    }
    .cs-field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }
    .cs-field select,
    .cs-field input[type=text] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.88rem;
      background: #fff;
    }

    .cs-job-type-toggle {
      display: flex;
      gap: 6px;
    }
    .cs-job-type-btn {
      flex: 1;
      padding: 7px 0;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cs-job-type-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .cs-submit-btn {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
    }
    .cs-submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .cs-submit-btn:not(:disabled):hover { opacity: 0.88; }

    .cs-hint {
      font-size: 0.74rem;
      color: #94a3b8;
      margin-top: 8px;
      text-align: center;
    }

    .cs-status-bar {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }
    .cs-status-bar.info    { background: #eff6ff; color: #1d4ed8; display: block; }
    .cs-status-bar.success { background: #f0fdf4; color: #15803d; display: block; }
    .cs-status-bar.error   { background: #fef2f2; color: #b91c1c; display: block; }

    .cs-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 10px;
    }
    .cs-loading {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .cs-none {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <header></header>

  <main class="container" style="padding-top: 24px; padding-bottom: 48px;">

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
      <div>
        <h1 style="font-size:1.4rem; margin:0;">Creative Studio</h1>
        <p style="color:#64748b; font-size:0.88rem; margin:4px 0 0;">
          Search Shopify products, select up to 5, pick a template and generate AI video creatives via Arcads
        </p>
      </div>
      <a href="/creative-review.html" class="btn btn-secondary" style="font-size:0.85rem;">
        View Review Queue →
      </a>
    </div>

    <div id="statusBar" class="cs-status-bar"></div>

    <div class="cs-layout">
      <!-- Left: product search -->
      <div>
        <div class="cs-section-title">Select Products</div>
        <div class="cs-search-bar">
          <input type="text" id="searchInput" placeholder="Search by product name…" autocomplete="off" />
          <button class="btn btn-secondary" id="btnSearch">Search</button>
        </div>
        <div id="productGrid" class="cs-product-grid">
          <div class="cs-loading">Enter a search term to browse products</div>
        </div>
      </div>

      <!-- Right: selection panel -->
      <div class="cs-panel">
        <h2>Generate Creative</h2>

        <div class="cs-field">
          <label>Job Type</label>
          <div class="cs-job-type-toggle">
            <button class="cs-job-type-btn active" data-type="single" id="btnSingle">Single Product</button>
            <button class="cs-job-type-btn"        data-type="collage" id="btnCollage">Collage</button>
          </div>
        </div>

        <div class="cs-field">
          <label>Selected Products <span id="selCount" style="font-weight:400; color:#94a3b8;">(0)</span></label>
          <ul class="cs-selected-list" id="selectedList">
            <li class="cs-empty-sel">No products selected yet</li>
          </ul>
        </div>

        <div class="cs-field">
          <label>Template</label>
          <select id="templateSelect">
            <option value="">— choose template —</option>
          </select>
        </div>

        <button class="cs-submit-btn" id="btnSubmit" disabled>Generate Creative</button>
        <p class="cs-hint" id="hintText">Select a product and template to begin</p>
      </div>
    </div>

  </main>

  <script src="creative-studio.js"></script>
  <script src="nav.js"></script>
</body>
</html>
