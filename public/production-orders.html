<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Orders — The Self Styler WMS</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .po-list-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .po-list-header h1 { font-size:1.4rem; font-weight:700; color:#1e293b; margin:0; }

    .po-filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .po-filter-btn { padding:6px 14px; border-radius:20px; border:1.5px solid #e2e8f0;
                     background:#fff; color:#64748b; font-size:0.82rem; font-weight:600;
                     cursor:pointer; transition:all 0.15s; }
    .po-filter-btn.active { background:#6366f1; color:#fff; border-color:#6366f1; }
    .po-filter-btn:hover:not(.active) { border-color:#6366f1; color:#6366f1; }

    .po-table-wrap { background:#fff; border-radius:12px; border:1px solid #e2e8f0; overflow:hidden; }
    .po-table { width:100%; border-collapse:collapse; font-size:0.88rem; }
    .po-table th { background:#f8fafc; color:#64748b; font-weight:600; font-size:0.78rem;
                   text-transform:uppercase; letter-spacing:0.05em; padding:10px 14px;
                   border-bottom:1px solid #e2e8f0; text-align:left; }
    .po-table td { padding:11px 14px; border-bottom:1px solid #f1f5f9; color:#334155; vertical-align:middle; }
    .po-table tr:last-child td { border-bottom:none; }
    .po-table tr:hover td { background:#f8fafc; cursor:pointer; }

    .po-status { display:inline-block; padding:2px 10px; border-radius:20px;
                 font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
    .po-status.draft     { background:#f1f5f9; color:#64748b; }
    .po-status.confirmed { background:#dbeafe; color:#1d4ed8; }
    .po-status.received  { background:#dcfce7; color:#166534; }
    .po-status.cancelled { background:#fee2e2; color:#991b1b; }

    .po-freight-badge { font-size:0.75rem; font-weight:700; }
    .po-freight-badge.sea { color:#0369a1; }
    .po-freight-badge.air { color:#7c3aed; }

    .po-num { font-weight:700; color:#6366f1; font-size:0.9rem; }
    .empty-cell { text-align:center; color:#94a3b8; padding:48px; font-size:0.9rem; }
  </style>
</head>
<body>
  <header></header>
  <main class="container" style="padding:28px 20px">

    <div class="po-list-header">
      <h1>Production Orders</h1>
      <button class="btn" onclick="window.location.href='/production-order.html'">+ New PO</button>
    </div>

    <div class="po-filters">
      <button class="po-filter-btn active" data-status="all"       onclick="setFilter('all',this)">All</button>
      <button class="po-filter-btn"        data-status="draft"     onclick="setFilter('draft',this)">Draft</button>
      <button class="po-filter-btn"        data-status="confirmed" onclick="setFilter('confirmed',this)">Confirmed</button>
      <button class="po-filter-btn"        data-status="received"  onclick="setFilter('received',this)">Received</button>
      <button class="po-filter-btn"        data-status="cancelled" onclick="setFilter('cancelled',this)">Cancelled</button>
    </div>

    <div class="po-table-wrap">
      <table class="po-table">
        <thead>
          <tr>
            <th>PO Number</th>
            <th>Supplier</th>
            <th>Order Date</th>
            <th>Delivery</th>
            <th>Freight</th>
            <th>Lines</th>
            <th>Total Units</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="po-tbody">
          <tr><td colspan="8" class="empty-cell">Loading…</td></tr>
        </tbody>
      </table>
    </div>

  </main>
  <script src="production-orders.js"></script>
  <script src="nav.js"></script>
</body>
</html>
