<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Locations — The Self Styler WMS</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header { flex-shrink: 0; }

    .loc-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

    .loc-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px 10px; background: #fff;
      border-bottom: 1px solid #e2e8f0; flex-shrink: 0; gap: 16px;
    }
    .loc-heading { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin: 0; }
    .loc-sub { font-size: 0.78rem; color: #94a3b8; margin: 2px 0 0; }
    .loc-topbar-right { display: flex; align-items: center; gap: 10px; }
    .loc-search {
      padding: 7px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 0.88rem; width: 260px; outline: none;
    }
    .loc-search:focus { border-color: #6366f1; }
    .loc-count { font-size: 0.8rem; color: #94a3b8; white-space: nowrap; }

    .loc-list { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .loc-loading { text-align: center; color: #94a3b8; padding: 40px; font-size: 0.9rem; }

    /* Product card */
    .loc-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
      margin-bottom: 8px; overflow: hidden;
    }
    .loc-card-main {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; flex-wrap: wrap;
    }
    .loc-thumb {
      width: 44px; height: 44px; border-radius: 6px; object-fit: cover;
      background: #f1f5f9; flex-shrink: 0;
    }
    .loc-thumb-placeholder {
      width: 44px; height: 44px; border-radius: 6px; background: #f1f5f9;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0; color: #cbd5e1;
    }
    .loc-title-col { flex: 1; min-width: 160px; }
    .loc-title { font-size: 0.88rem; font-weight: 600; color: #1e293b; }
    .loc-title-meta { font-size: 0.73rem; color: #94a3b8; margin-top: 1px; }

    .loc-fields { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .loc-field-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; margin-bottom: 3px; }

    .loc-aisle-select {
      padding: 5px 8px; border: 1.5px solid #e2e8f0; border-radius: 6px;
      font-size: 0.83rem; color: #1e293b; background: #fff; width: 82px;
    }
    .loc-bay-input {
      padding: 5px 8px; border: 1.5px solid #e2e8f0; border-radius: 6px;
      font-size: 0.83rem; color: #1e293b; width: 58px;
    }
    .loc-excess-input {
      padding: 5px 8px; border: 1.5px solid #e2e8f0; border-radius: 6px;
      font-size: 0.83rem; color: #1e293b; width: 180px;
    }
    .loc-aisle-select:focus, .loc-bay-input:focus, .loc-excess-input:focus {
      outline: none; border-color: #6366f1;
    }
    .loc-save-dot {
      width: 7px; height: 7px; border-radius: 50%; background: transparent;
      transition: background 0.3s; flex-shrink: 0;
    }
    .loc-save-dot.saving { background: #f59e0b; }
    .loc-save-dot.saved  { background: #22c55e; }
    .loc-save-dot.error  { background: #ef4444; }

    .loc-variants-btn {
      margin: 0 14px 0 auto; padding: 4px 10px;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
      font-size: 0.75rem; font-weight: 600; color: #64748b; cursor: pointer;
      white-space: nowrap;
    }
    .loc-variants-btn:hover { border-color: #6366f1; color: #6366f1; }
    .loc-variants-btn.open { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

    /* Variant overrides section */
    .loc-variants-panel {
      border-top: 1px solid #f1f5f9; background: #f8fafc;
      padding: 10px 14px 10px 70px;
    }
    .loc-variant-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap;
    }
    .loc-variant-row:last-child { border-bottom: none; }
    .loc-variant-name {
      font-size: 0.8rem; color: #475569; font-weight: 500;
      min-width: 140px; flex-shrink: 0;
    }
    .loc-variant-sku { font-size: 0.7rem; color: #94a3b8; margin-left: 4px; }
    .loc-inherit-badge {
      font-size: 0.72rem; color: #94a3b8; font-style: italic;
    }
    .loc-override-btn {
      padding: 3px 8px; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 5px; font-size: 0.72rem; color: #6366f1; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .loc-override-btn:hover { background: #eff6ff; }
    .loc-remove-btn {
      padding: 3px 7px; background: #fee2e2; border: 1px solid #fca5a5;
      border-radius: 5px; font-size: 0.72rem; color: #b91c1c; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .loc-remove-btn:hover { background: #fecaca; }

    /* Aisle colour pills on select */
    .loc-aisle-pill {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 2px; margin-right: 4px; vertical-align: middle;
    }
  </style>
</head>
<body>
  <header></header>
  <div class="loc-wrap">
    <div class="loc-topbar">
      <div>
        <h1 class="loc-heading">Stock Locations</h1>
        <p class="loc-sub">Assign Aisle &amp; Bay to each product. Expand to override per-variant.</p>
      </div>
      <div class="loc-topbar-right">
        <input type="search" id="loc-search" class="loc-search" placeholder="Search products or SKU…" />
        <span id="loc-count" class="loc-count"></span>
      </div>
    </div>
    <div id="loc-list" class="loc-list">
      <div class="loc-loading">Loading products…</div>
    </div>
  </div>
  <script src="locations.js"></script>
  <script src="nav.js"></script>
</body>
</html>
