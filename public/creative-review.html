<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Review – The Self Styler WMS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    .cr-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }
    .cr-filter-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cr-filter-btn {
      padding: 5px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: #f8fafc;
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cr-filter-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .cr-job-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .cr-job-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .cr-job-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .cr-job-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e293b;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cr-status-pill {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .cr-status-pill.queued     { background: #f1f5f9; color: #64748b; }
    .cr-status-pill.generating { background: #eff6ff; color: #2563eb; }
    .cr-status-pill.ready      { background: #fefce8; color: #a16207; }
    .cr-status-pill.approved   { background: #f0fdf4; color: #15803d; }
    .cr-status-pill.rejected   { background: #fef2f2; color: #b91c1c; }
    .cr-status-pill.archived   { background: #f8fafc; color: #94a3b8; }
    .cr-status-pill.error      { background: #fef2f2; color: #b91c1c; }

    .cr-job-meta {
      padding: 10px 16px;
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cr-job-meta span {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .cr-job-preview {
      padding: 0 16px 12px;
      flex: 1;
    }
    .cr-video-wrap {
      border-radius: 8px;
      overflow: hidden;
      background: #f8fafc;
      aspect-ratio: 9/16;
      max-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cr-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .cr-video-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cr-no-preview {
      width: 100%;
      aspect-ratio: 9/16;
      max-height: 280px;
      background: #f8fafc;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #94a3b8;
    }
    .cr-no-preview-icon { font-size: 2.5rem; }
    .cr-no-preview-text { font-size: 0.8rem; }

    .cr-multi-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 6px;
    }
    .cr-multi-preview a img {
      width: 100%;
      aspect-ratio: 9/16;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .cr-brief-toggle {
      font-size: 0.74rem;
      color: #6366f1;
      cursor: pointer;
      margin: 6px 0 0;
      display: inline-block;
    }
    .cr-brief-body {
      font-size: 0.75rem;
      color: #475569;
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 6px;
      display: none;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
    }
    .cr-brief-body.open { display: block; }

    .cr-job-actions {
      padding: 12px 16px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cr-action-btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .cr-action-btn:hover { opacity: 0.8; }
    .cr-action-btn.approve  { background: #16a34a; color: #fff; }
    .cr-action-btn.reject   { background: #fff; border-color: #fca5a5; color: #b91c1c; }
    .cr-action-btn.archive  { background: #fff; border-color: #e2e8f0; color: #64748b; }
    .cr-action-btn.delete   { background: #fff; border-color: #fca5a5; color: #b91c1c; }
    .cr-action-btn.retry    { background: #6366f1; color: #fff; }
    .cr-action-btn.download { background: #0f172a; color: #fff; }

    .cr-loading {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .cr-empty {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }
    .cr-empty-icon { font-size: 3rem; margin-bottom: 10px; }
    .cr-empty-text { font-size: 0.9rem; }

    .cr-status-bar {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }
    .cr-status-bar.info    { background: #eff6ff; color: #1d4ed8; display: block; }
    .cr-status-bar.success { background: #f0fdf4; color: #15803d; display: block; }
    .cr-status-bar.error   { background: #fef2f2; color: #b91c1c; display: block; }

    .cr-refresh-info {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <header></header>

  <main class="container" style="padding-top: 24px; padding-bottom: 48px;">

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
      <div>
        <h1 style="font-size:1.4rem; margin:0;">Creative Review</h1>
        <p style="color:#64748b; font-size:0.88rem; margin:4px 0 0;">
          Review, approve or reject AI-generated creatives before use
        </p>
      </div>
      <a href="/creative-studio.html" class="btn btn-primary" style="font-size:0.85rem;">
        + New Creative
      </a>
    </div>

    <div id="statusBar" class="cr-status-bar"></div>

    <div class="cr-controls">
      <div class="cr-filter-btns" id="filterBtns">
        <button class="cr-filter-btn active" data-status="">All</button>
        <button class="cr-filter-btn" data-status="queued">Queued</button>
        <button class="cr-filter-btn" data-status="generating">Generating</button>
        <button class="cr-filter-btn" data-status="ready">Ready</button>
        <button class="cr-filter-btn" data-status="approved">Approved</button>
        <button class="cr-filter-btn" data-status="rejected">Rejected</button>
        <button class="cr-filter-btn" data-status="archived">Archived</button>
      </div>
      <button class="btn btn-secondary" id="btnRefresh" style="margin-left:auto; font-size:0.82rem;">Refresh</button>
      <span class="cr-refresh-info" id="refreshInfo"></span>
    </div>

    <div id="jobsContainer">
      <div class="cr-loading">Loading jobs…</div>
    </div>

  </main>

  <script src="creative-review.js"></script>
  <script src="nav.js"></script>
</body>
</html>
