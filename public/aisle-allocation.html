<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aisle Allocation — The Self Styler WMS</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .aa-wrap { max-width: 860px; margin: 0 auto; padding: 18px 14px 70px; }
    .aa-head { display: flex; justify-content: space-between; align-items: center;
               gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .aa-head h1 { margin: 0; font-size: 1.3rem; }
    .aa-progress { font-size: 0.95rem; font-weight: 800; color: #4338ca; }
    .aa-sub { color: #64748b; font-size: 0.84rem; margin-bottom: 14px; }

    .aa-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
                  margin-bottom: 14px; }
    .aa-toolbar input[type="search"] { flex: 1; min-width: 180px; padding: 12px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
    .aa-toolbar select { padding: 12px 10px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; font-size: 0.95rem; background: #fff; }

    .aa-row { display: flex; align-items: center; gap: 12px; background: #fff;
              border: 1px solid #e2e8f0; border-radius: 14px; padding: 10px 12px;
              margin-bottom: 10px; }
    .aa-row img { width: 52px; height: 68px; object-fit: cover; border-radius: 9px;
                  background: #f1f5f9; flex-shrink: 0; }
    .aa-noimg { width: 52px; height: 68px; border-radius: 9px; background: #f1f5f9;
                flex-shrink: 0; }
    .aa-info { flex: 1; min-width: 0; }
    .aa-title { font-weight: 700; font-size: 0.95rem; color: #1e293b; line-height: 1.3; }
    .aa-current { font-size: 0.72rem; font-weight: 700; margin-top: 3px; }

    .aa-pick { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .aa-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.12);
              flex-shrink: 0; }
    .aa-select { padding: 12px 8px; border: 1.5px solid #e2e8f0; border-radius: 10px;
                 font-size: 0.95rem; font-weight: 700; background: #fff; max-width: 150px; }
    .aa-save { background: #4f46e5; color: #fff; border: none; border-radius: 10px;
               padding: 13px 20px; font-size: 0.95rem; font-weight: 800; cursor: pointer;
               flex-shrink: 0; }
    .aa-save:disabled { opacity: 0.5; }
    .aa-save.done { background: #16a34a; }

    .aa-pager { display: flex; gap: 8px; align-items: center; justify-content: center;
                margin-top: 16px; }
    .aa-pager button { padding: 11px 18px; border: 1.5px solid #e2e8f0; background: #fff;
                       border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
    .aa-pager button:disabled { opacity: 0.4; }
    .aa-empty { text-align: center; color: #64748b; padding: 40px 10px; font-size: 0.95rem; }
    @media (max-width: 560px) {
      .aa-row { flex-wrap: wrap; }
      .aa-pick { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <header></header>
  <div class="aa-wrap">
    <div class="aa-head">
      <h1>🎨 Aisle Allocation</h1>
      <span class="aa-progress" id="aa-progress"></span>
    </div>
    <div class="aa-sub">Link each style to its aisle colour. The suggestion follows the
      alphabetical shelf walk — if it's right, just tap <b>Save</b>; otherwise pick the
      colour first. Colours can be renamed or changed later without losing these links.</div>

    <div class="aa-toolbar">
      <input type="search" id="aa-search" placeholder="Search styles…" />
      <select id="aa-filter" onchange="resetAndLoad()">
        <option value="unallocated">Not allocated</option>
        <option value="all">All styles</option>
      </select>
      <select id="aa-pagesize" onchange="resetAndLoad()">
        <option value="20">20 / page</option>
        <option value="50">50 / page</option>
        <option value="100">100 / page</option>
      </select>
    </div>

    <div id="aa-list"><div class="aa-empty">Loading…</div></div>

    <div class="aa-pager">
      <button id="aa-prev" onclick="movePage(-1)">‹ Prev</button>
      <span id="aa-pageinfo" style="font-size:0.9rem;color:#475569;font-weight:600"></span>
      <button id="aa-next" onclick="movePage(1)">Next ›</button>
    </div>
  </div>
  <script src="aisle-allocation.js"></script>
  <script src="nav.js"></script>
</body>
</html>
