<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Documents – The Self Styler WMS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    .md-page-title { font-size: 1.6rem; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .md-sub { color: #64748b; font-size: 0.88rem; margin-bottom: 22px; }

    .md-card {
      background: #fff; border: 1.5px solid #e2e8f0; border-radius: 14px;
      padding: 22px; margin-bottom: 18px;
    }
    .md-card.due { border-color: #fcd34d; box-shadow: 0 0 0 3px #fef3c7; }
    .md-doc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .md-doc-title { font-size: 1.05rem; font-weight: 700; color: #1e293b; }
    .md-doc-meta { font-size: 0.8rem; color: #94a3b8; margin-top: 3px; }
    .md-badge {
      display: inline-block; padding: 3px 10px; border-radius: 99px;
      font-size: 0.76rem; font-weight: 700; white-space: nowrap;
    }
    .md-badge.pending      { background: #fef3c7; color: #92400e; }
    .md-badge.renewal_due  { background: #fef3c7; color: #92400e; }
    .md-badge.acknowledged { background: #dcfce7; color: #15803d; }
    .md-badge.declined     { background: #fee2e2; color: #b91c1c; }

    .md-view-btn {
      display: inline-block; padding: 8px 16px; border: 1.5px solid #e2e8f0;
      border-radius: 9px; background: #fff; color: #4f46e5; font-weight: 600;
      font-size: 0.88rem; text-decoration: none; margin: 12px 0;
    }
    .md-view-btn:hover { border-color: #4f46e5; }

    .md-sign-box { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-top: 8px; }
    .md-sign-box label { display: flex; align-items: flex-start; gap: 8px; font-size: 0.9rem; color: #334155; cursor: pointer; margin-bottom: 12px; }
    .md-sign-box input[type=checkbox] { margin-top: 3px; accent-color: #4f46e5; }
    .md-name-input {
      width: 100%; max-width: 320px; padding: 9px 12px; border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; margin-bottom: 12px;
    }
    .md-name-input:focus { border-color: #4f46e5; }
    .md-sign-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .md-decline-btn { background: #fff; border: 1.5px solid #fecaca; color: #b91c1c; }
    .md-decline-btn:hover { background: #fef2f2; }
    .md-fineprint { font-size: 0.74rem; color: #94a3b8; margin-top: 10px; }

    .md-history-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    .md-history-table th {
      text-align: left; padding: 8px 10px; font-size: 0.72rem; font-weight: 600;
      color: #64748b; text-transform: uppercase; border-bottom: 2px solid #e2e8f0;
    }
    .md-history-table td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; }
    .md-empty { color: #94a3b8; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <header></header>
  <main class="container" style="padding-top:28px;max-width:840px">

    <div class="md-page-title">My Documents</div>
    <div class="md-sub">Company documents that need your review and sign-off. Your responses are recorded permanently.</div>

    <div id="md-list"><div class="md-empty">Loading…</div></div>

    <div class="md-card">
      <div class="md-doc-title" style="margin-bottom:12px">My Sign-Off History</div>
      <div style="overflow-x:auto">
        <table class="md-history-table">
          <thead><tr><th>Document</th><th>Version</th><th>Response</th><th>Signed As</th><th>Date</th></tr></thead>
          <tbody id="md-history"><tr><td colspan="5" class="md-empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

  </main>
  <script src="nav.js"></script>
  <script src="my-documents.js"></script>
</body>
</html>
