<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave Calendar – The Self Styler WMS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    /* ── Nav bar ───────────────────────────────────────────────────── */
    .lc-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .lc-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lc-nav-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fff;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      transition: background 0.12s, color 0.12s;
    }
    .lc-nav-btn:hover { background: #f1f5f9; color: #1e293b; }
    .lc-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      min-width: 200px;
      text-align: center;
    }
    .lc-today-btn {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fff;
      font-size: 0.83rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: background 0.12s;
    }
    .lc-today-btn:hover { background: #f1f5f9; }

    /* ── Calendar grid ─────────────────────────────────────────────── */
    .lc-grid-wrap { overflow-x: auto; }

    .lc-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(110px, 1fr));
      gap: 1px;
      background: #e2e8f0;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      min-width: 700px;
    }

    .lc-col-header {
      background: #f8fafc;
      padding: 10px 4px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .lc-col-header.weekend { color: #cbd5e1; }

    .lc-day {
      background: #fff;
      min-height: 120px;
      padding: 8px 7px 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .lc-day.other-month   { background: #f9fafb; }
    .lc-day.weekend       { background: #fafafa; }
    .lc-day.other-month .lc-day-num { color: #cbd5e1; }

    .lc-day-num {
      font-size: 0.82rem;
      font-weight: 600;
      color: #475569;
      line-height: 1;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .lc-day-num span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }
    .lc-day.today .lc-day-num span {
      background: #6366f1;
      color: #fff;
    }

    .lc-events { flex: 1; display: flex; flex-direction: column; gap: 2px; }

    .lc-chip {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.5;
      cursor: default;
    }
    .lc-chip.holiday  { background: #dbeafe; color: #1e40af; }
    .lc-chip.blackout { background: #fee2e2; color: #991b1b; }
    .lc-chip.leave    { background: #dcfce7; color: #166534; }
    .lc-chip.more     { background: #f1f5f9; color: #64748b; }

    /* ── Legend ────────────────────────────────────────────────────── */
    .lc-legend {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: #64748b;
    }
    .lc-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lc-legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .lc-legend-dot.holiday  { background: #93c5fd; }
    .lc-legend-dot.blackout { background: #fca5a5; }
    .lc-legend-dot.leave    { background: #86efac; }

    /* ── Loading/error ─────────────────────────────────────────────── */
    .lc-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      color: #94a3b8;
      border-radius: 14px;
    }
    .lc-grid-container { position: relative; }
  </style>
</head>
<body>
  <header></header>

  <main class="container" style="padding-top: 24px; padding-bottom: 48px;">

    <div class="lc-toolbar">
      <div>
        <h1 style="font-size:1.4rem; margin:0;">Leave Calendar</h1>
        <p style="color:#64748b; font-size:0.88rem; margin:4px 0 0;">
          Approved leave, public holidays &amp; blackout periods
        </p>
      </div>
      <div class="lc-nav">
        <button class="lc-nav-btn" id="btnPrev" title="Previous month">&#8249;</button>
        <div class="lc-title" id="calTitle">Loading…</div>
        <button class="lc-nav-btn" id="btnNext" title="Next month">&#8250;</button>
        <button class="lc-today-btn" id="btnToday">Today</button>
      </div>
    </div>

    <div class="lc-grid-wrap">
      <div class="lc-grid-container">
        <div class="lc-grid" id="calGrid">
          <!-- column headers -->
          <div class="lc-col-header">Mon</div>
          <div class="lc-col-header">Tue</div>
          <div class="lc-col-header">Wed</div>
          <div class="lc-col-header">Thu</div>
          <div class="lc-col-header">Fri</div>
          <div class="lc-col-header weekend">Sat</div>
          <div class="lc-col-header weekend">Sun</div>
          <!-- 42 day cells (6 weeks) rendered by JS -->
        </div>
        <div class="lc-overlay" id="calOverlay" style="display:none;">Loading…</div>
      </div>
    </div>

    <div class="lc-legend">
      <div class="lc-legend-item"><div class="lc-legend-dot leave"></div> Staff Leave</div>
      <div class="lc-legend-item"><div class="lc-legend-dot holiday"></div> Public Holiday</div>
      <div class="lc-legend-item"><div class="lc-legend-dot blackout"></div> Blackout Period</div>
    </div>

  </main>

  <script src="leave-calendar.js"></script>
  <script src="nav.js"></script>
</body>
</html>
