<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Packing — TSS WMS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Shared layout ──────────────────────────────────── */
    body { background: #f1f5f9; }
    .pk-wrap { max-width: 780px; margin: 0 auto; padding: 20px 14px; }

    /* ── Setup card ─────────────────────────────────────── */
    .pk-setup-card {
      background: #fff; border-radius: 16px;
      padding: 28px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .pk-setup-card h1 { font-size: 1.5rem; font-weight: 800; color: #1a1a2e; margin: 0 0 4px; }
    .pk-setup-card p  { font-size: 0.85rem; color: #64748b; margin: 0 0 24px; }

    .pk-fields { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .pk-field  { display: flex; flex-direction: column; gap: 5px; }
    .pk-field label { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .05em; }
    .pk-field input {
      padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
      font-size: 1rem; font-weight: 600; color: #1a1a2e; width: 130px;
      outline: none; transition: border-color .15s;
    }
    .pk-field input:focus { border-color: #22c55e; }
    .pk-field.initials input { width: 80px; text-transform: uppercase; }

    .pk-btn-row  { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .pk-btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 13px 28px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #fff; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: opacity .15s, transform .1s; flex: 1;
    }
    .pk-btn-primary:hover  { opacity: .92; }
    .pk-btn-primary:active { transform: scale(.98); }
    .pk-btn-secondary {
      padding: 11px 20px; border: 2px solid #e2e8f0; background: #fff;
      border-radius: 10px; font-size: 0.9rem; font-weight: 700; color: #334155;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .pk-btn-secondary:hover { background: #f8fafc; }

    /* ── Loading ─────────────────────────────────────────── */
    .pk-loading { text-align: center; padding: 48px 24px; color: #64748b; }
    .pk-spinner {
      width: 36px; height: 36px; border: 3px solid #e2e8f0;
      border-top-color: #22c55e; border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Packing view ────────────────────────────────────── */
    #view-packing { display: none; flex-direction: column; }

    /* ── Sticky header ───────────────────────────────────── */
    .pk-header {
      position: sticky; top: 0; z-index: 20;
      background: #1e293b; padding: 0;
      border-radius: 0 0 14px 14px;
      margin: -20px -14px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .pk-header-inner {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px 10px;
    }
    .pk-back-btn {
      background: none; border: 1px solid rgba(255,255,255,.2); color: #94a3b8;
      padding: 6px 12px; border-radius: 8px; font-size: 0.78rem;
      font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .pk-back-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

    .pk-header-title {
      flex: 1; min-width: 0;
    }
    .pk-order-num {
      font-size: 1.05rem; font-weight: 800; color: #f1f5f9;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pk-customer-name {
      font-size: 0.78rem; color: #94a3b8; margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pk-progress-pill {
      background: rgba(255,255,255,.1); color: #cbd5e1;
      padding: 4px 10px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700; white-space: nowrap; flex-shrink: 0;
    }
    .pk-prog-track {
      height: 4px; background: rgba(255,255,255,.1);
      border-radius: 0 0 14px 14px; overflow: hidden;
    }
    .pk-prog-fill {
      height: 4px; background: #22c55e; border-radius: 0 0 14px 14px;
      transition: width .4s ease;
    }

    /* ── Body ────────────────────────────────────────────── */
    .pk-body {
      flex: 1;
      padding-bottom: 100px; /* clear fixed footer */
      transition: opacity .15s ease, transform .15s ease;
    }

    /* ── Packed indicator ────────────────────────────────── */
    .pk-packed-indicator {
      display: none; align-items: center; justify-content: center; gap: 12px;
      background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 12px;
      padding: 12px 20px; margin-bottom: 14px;
      font-size: 0.95rem; font-weight: 700; color: #15803d;
    }

    /* ── Note banner ─────────────────────────────────────── */
    .pk-note-banner {
      background: #fefce8; border: 1px solid #fde047; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 14px;
      font-size: 0.88rem; color: #713f12;
    }
    .pk-note-text  { margin-top: 4px; font-weight: 500; }
    .pk-note-attr  { margin-top: 4px; font-weight: 500; }

    /* ── Removed items banner ────────────────────────────── */
    .pk-removed-banner {
      background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 14px;
      font-size: 0.85rem; color: #92400e; font-weight: 600;
    }

    /* ── Items grid ──────────────────────────────────────── */
    .pk-grid {
      display: grid;
      gap: 12px;
    }
    .pk-grid--1 {
      grid-template-columns: minmax(0, 420px);
      justify-content: center;
    }
    .pk-grid--2 {
      grid-template-columns: repeat(2, 1fr);
      max-width: 820px; margin: 0 auto;
    }
    .pk-grid--3 { grid-template-columns: repeat(3, 1fr); }
    .pk-grid--4 { grid-template-columns: repeat(4, 1fr); }
    .pk-grid--many {
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    }

    @media (max-width: 900px) {
      .pk-grid--4 { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .pk-grid--3, .pk-grid--4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px) {
      .pk-grid--2 { grid-template-columns: 1fr; max-width: 280px; }
    }

    /* ── Item card ───────────────────────────────────────── */
    .pk-item-card {
      background: #fff; border-radius: 14px;
      border: 2px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: border-color .15s;
    }
    .pk-item-card.multi {
      border-color: #ef4444;
      background: #fff5f5;
    }

    /* Image wrapper — always square */
    .pk-img-wrap {
      position: relative;
      padding-bottom: 100%;
      background: #f1f5f9;
      overflow: hidden;
    }
    .pk-img-wrap img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 0;
    }
    .pk-img-ph {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; color: #cbd5e1;
    }

    /* Multi-quantity badge on image */
    .pk-qty-badge {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      background: #ef4444; color: #fff;
      font-size: 1.1rem; font-weight: 900;
      padding: 3px 11px; border-radius: 20px;
      box-shadow: 0 2px 6px rgba(239,68,68,.5);
      letter-spacing: .02em;
    }

    /* Item info below image */
    .pk-item-info {
      padding: 10px 12px 12px;
    }
    .pk-item-name {
      font-size: 0.78rem; color: #64748b; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .pk-item-size {
      font-size: 1.05rem; font-weight: 800; color: #0f172a;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .pk-item-sku {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem; font-weight: 600; color: #475569;
      letter-spacing: .02em;
    }
    .pk-item-qty-label {
      margin-top: 6px; font-size: 0.8rem; font-weight: 700;
      color: #dc2626; background: #fee2e2;
      padding: 2px 8px; border-radius: 6px; display: inline-block;
    }
    .pk-mod-badge {
      margin-top: 5px; font-size: 0.72rem; font-weight: 600;
      color: #d97706; background: #fef3c7;
      padding: 2px 7px; border-radius: 5px; display: inline-block;
    }

    /* ── Fixed footer ────────────────────────────────────── */
    .pk-footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: #fff; border-top: 1px solid #e2e8f0;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .pk-footer-inner {
      max-width: 780px; margin: 0 auto;
      display: flex; align-items: center; gap: 10px;
    }

    /* Prev / Next */
    .pk-nav-prev, .pk-nav-next {
      padding: 12px 18px; border: 2px solid #e2e8f0; background: #fff;
      border-radius: 12px; font-size: 0.88rem; font-weight: 700; color: #334155;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background .15s;
    }
    .pk-nav-prev:hover, .pk-nav-next:hover { background: #f8fafc; }
    .pk-nav-prev:disabled, .pk-nav-next:disabled { opacity: .35; cursor: not-allowed; }

    /* Pack button */
    .pk-pack-btn {
      flex: 1; padding: 14px 20px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #fff; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 800; cursor: pointer;
      transition: background .2s, transform .1s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      text-align: center; letter-spacing: .03em;
    }
    .pk-pack-btn:active { transform: scale(.98); }
    .pk-pack-btn.primed {
      background: linear-gradient(135deg, #d97706, #fbbf24);
    }
    .pk-pack-btn.packed {
      background: #64748b;
      cursor: default;
    }

    /* ── Done view ───────────────────────────────────────── */
    .pk-done-card {
      background: #f0fdf4; border: 2px solid #bbf7d0; border-radius: 16px;
      padding: 40px 24px; text-align: center;
    }
    .pk-done-icon  { font-size: 3rem; margin-bottom: 12px; }
    .pk-done-title { font-size: 1.5rem; font-weight: 800; color: #15803d; margin-bottom: 8px; }
    .pk-done-sub   { font-size: 0.9rem; color: #166534; margin-bottom: 28px; }
  </style>
</head>
<body>
<header></header>

<!-- ── Setup view ── -->
<div id="view-setup" class="pk-wrap">
  <div class="pk-setup-card">
    <h1>&#128230; Order Packing</h1>
    <p>Pack orders one at a time with full visual confirmation — large images, SKU, and size for every item.</p>

    <div class="pk-fields">
      <div class="pk-field initials">
        <label>Your Initials</label>
        <input id="pk-initials" type="text" maxlength="3" placeholder="DM" autocomplete="off">
      </div>
      <div class="pk-field">
        <label>Start Order #</label>
        <input id="pk-start" type="number" placeholder="286988" autocomplete="off">
      </div>
      <div class="pk-field">
        <label>End Order #</label>
        <input id="pk-end" type="number" placeholder="287088" autocomplete="off">
      </div>
    </div>

    <div class="pk-btn-row">
      <button class="pk-btn-secondary" onclick="addToEnd(50)">+50</button>
      <button class="pk-btn-secondary" onclick="addToEnd(100)">+100</button>
      <button class="pk-btn-primary" onclick="loadOrders()">&#9654; Start Packing</button>
    </div>
  </div>
</div>

<!-- ── Loading view ── -->
<div id="view-loading" style="display:none" class="pk-wrap">
  <div class="pk-loading">
    <div class="pk-spinner"></div>
    Loading orders from Shopify…
  </div>
</div>

<!-- ── Packing view ── -->
<div id="view-packing" class="pk-wrap">

  <!-- Sticky header -->
  <div class="pk-header">
    <div class="pk-header-inner">
      <button class="pk-back-btn" onclick="backToSetup()">&#8592; Setup</button>
      <div class="pk-header-title">
        <div id="pk-order-num" class="pk-order-num"></div>
        <div id="pk-customer-name" class="pk-customer-name"></div>
      </div>
      <span id="pk-progress" class="pk-progress-pill"></span>
    </div>
    <div class="pk-prog-track">
      <div id="pk-prog-bar" class="pk-prog-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Scrollable body -->
  <div id="pk-body" class="pk-body">

    <!-- Packed confirmation strip -->
    <div id="pk-packed-indicator" class="pk-packed-indicator">
      &#10004; This order has been packed
    </div>

    <!-- Order note banner -->
    <div id="pk-note-banner" class="pk-note-banner" style="display:none"></div>

    <!-- Removed/refunded items warning -->
    <div id="pk-removed-banner" class="pk-removed-banner" style="display:none"></div>

    <!-- Items grid -->
    <div id="pk-items-grid" class="pk-grid"></div>

  </div>

  <!-- Fixed footer -->
  <div class="pk-footer">
    <div class="pk-footer-inner">
      <button id="pk-prev-btn" class="pk-nav-prev" onclick="prevOrder()">&#8592; Prev</button>
      <button id="pk-pack-btn" class="pk-pack-btn" onclick="onPackBtn()">
        <span id="pk-pack-label">PACK ORDER</span>
      </button>
      <button id="pk-next-btn" class="pk-nav-next" onclick="nextOrder()" style="display:none">Next &#8594;</button>
    </div>
  </div>

</div>

<!-- ── Done view ── -->
<div id="view-done" style="display:none" class="pk-wrap">
  <div class="pk-done-card">
    <div class="pk-done-icon">&#9989;</div>
    <div class="pk-done-title">All Packed!</div>
    <div class="pk-done-sub" id="pk-done-sub"></div>
    <button class="pk-btn-primary" onclick="backToSetup()" style="max-width:280px;margin:0 auto">
      Pack Next Batch
    </button>
  </div>
</div>

<script src="nav.js"></script>
<script src="packing.js"></script>
</body>
</html>
